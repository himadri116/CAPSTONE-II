services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  ml-service:
    build: ./ml-service
    image: ${IMAGE_PREFIX:-bugsight}/ml-service:${TAG:-latest}
    restart: unless-stopped

  server:
    build: ./server
    image: ${IMAGE_PREFIX:-bugsight}/server:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: mongodb://mongo:27017/bugsight
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      mongo: { condition: service_healthy }
      ml-service: { condition: service_started }

  client:
    build: ./client
    image: ${IMAGE_PREFIX:-bugsight}/client:${TAG:-latest}
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [server]

volumes:
  mongo-data:
