name: capstone

services:
  mongo:
    image: mongo:7.0
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/${MONGODB_DATABASE:-bugsight}}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the project .env file}
      - AUTH_API_URL=http://localhost:5000
      - ALLOWED_ORIGINS=https://localhost:8443,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - SDP_TEMP_REPO_DIR=/tmp/sdp_github_temp_repos
      - PREDICTION_HISTORY_DB_PATH=/var/data/prediction_history.db
      - ALLOW_LOCAL_CACHE_MODE=true
      - ALLOW_HISTORY_DELETE=true
      - MAX_SOURCE_FILES_PER_RUN=500
    volumes:
      - prediction_data:/var/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${AUTH_HOST_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/${MONGODB_DATABASE:-bugsight}}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the project .env file}
      - API_DOCS_URL=http://localhost:8001/docs
      - CLIENT_URL=https://localhost:8443,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8001,http://127.0.0.1:8001
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-402610411923-g3r7t82ht7tes01ofn6a838tsb1oct64.apps.googleusercontent.com}
      - EMAIL_SERVICE=${EMAIL_SERVICE:-gmail}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/scan
        - VITE_AUTH_API_URL=
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-402610411923-g3r7t82ht7tes01ofn6a838tsb1oct64.apps.googleusercontent.com}
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:80"
      - "${FRONTEND_HTTPS_PORT:-8443}:443"
    volumes:
      - tls_certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      auth-server:
        condition: service_started
    restart: unless-stopped

  tls-cert-init:
    image: alpine:3.21
    profiles:
      - local-tls
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -s /source/localhost.pem
        test -s /source/localhost-key.pem
        cp /source/localhost.pem /certs/localhost.pem
        cp /source/localhost-key.pem /certs/localhost-key.pem
        chmod 644 /certs/localhost.pem
        chmod 600 /certs/localhost-key.pem
    volumes:
      - ./frontend/certs:/source:ro
      - tls_certs:/certs

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: bugsight-jenkins:custom
    container_name: bugsight-jenkins
    user: root
    environment:
      - TZ=Asia/Kolkata
      - JAVA_OPTS=-Duser.timezone=Asia/Kolkata
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - tls_certs:/tls_certs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: bugsight-ngrok
    profiles:
      - ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command:
      - "http"
      - "jenkins:8080"
    ports:
      - "4040:4040"
    depends_on:
      - jenkins

volumes:
  prediction_data:
    driver: local
  mongo_data:
    driver: local
  jenkins_data:
    driver: local
  tls_certs:
    name: capstone_tls_certs
