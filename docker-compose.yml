services:
  mongo:
    image: mongo:7.0
    container_name: bugsight-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdp-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - SDP_TEMP_REPO_DIR=/tmp/sdp_github_temp_repos
      - PREDICTION_HISTORY_DB_PATH=/var/data/prediction_history.db
      - ALLOW_LOCAL_CACHE_MODE=true
      - ALLOW_HISTORY_DELETE=true
      - MAX_SOURCE_FILES_PER_RUN=500
    volumes:
      - prediction_data:/var/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sdp-auth-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/sdp_auth
      - JWT_SECRET=${JWT_SECRET:-d88846c48dfef06a3b0e460f15a712cc1caa19e30a3d48b5ffa13961e8f4cccffa5d1b0508b2a64da2e9fe9df2b3ea37}
      - CLIENT_URL=http://localhost:3000,http://localhost:5173
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-402610411923-g3r7t82ht7tes01ofn6a838tsb1oct64.apps.googleusercontent.com}
      - EMAIL_SERVICE=${EMAIL_SERVICE:-gmail}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8001
        - VITE_AUTH_API_URL=http://localhost:5000
        - VITE_GOOGLE_CLIENT_ID=402610411923-g3r7t82ht7tes01ofn6a838tsb1oct64.apps.googleusercontent.com
    container_name: sdp-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: bugsight-jenkins
    user: root
    environment:
      - TZ=Asia/Kolkata
      - JAVA_OPTS=-Duser.timezone=Asia/Kolkata
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: bugsight-ngrok
    profiles:
      - ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command:
      - "http"
      - "sdp-frontend:80"
    ports:
      - "4040:4040"
    depends_on:
      - frontend

volumes:
  prediction_data:
    driver: local
  mongo_data:
    driver: local
  jenkins_data:
    driver: local
