services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdp-backend
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - ALLOW_LOCAL_CACHE_MODE=true
      - ALLOW_HISTORY_DELETE=true
      - MAX_SOURCE_FILES_PER_RUN=500
      - SDP_TEMP_REPO_DIR=/tmp/sdp_github_temp_repos
      - PREDICTION_HISTORY_DB_PATH=/var/data/prediction_history.db
    volumes:
      - prediction_data:/var/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: sdp-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sdp-auth-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/sdp_auth
      - JWT_SECRET=${JWT_SECRET:-change-this-development-secret}
      - CLIENT_URL=http://localhost:3000,http://localhost:5173
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - EMAIL_SERVICE=${EMAIL_SERVICE:-gmail}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8001
        - VITE_AUTH_API_URL=http://localhost:5000
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: sdp-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prediction_data:
    driver: local
  mongo_data:
    driver: local
